<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>洪崖洞 · 夜 — Three.js 程序化 3D 场景</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05080d;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
    color: #e9dcc6;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* ============ 加载遮罩 ============ */
  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at 50% 58%, #12202e 0%, #0a121c 45%, #05080d 100%);
    transition: opacity 0.9s ease;
  }
  #loading .brand {
    font-size: 30px; letter-spacing: 14px; text-indent: 14px;
    color: #f0d9b0; font-weight: 400;
    text-shadow: 0 0 26px rgba(255, 160, 70, 0.55), 0 0 60px rgba(255, 120, 40, 0.28);
  }
  #loading .brand-sub {
    font-size: 11px; letter-spacing: 4px; color: #8a7f6d; margin-top: -14px;
  }
  .bar-track {
    width: 230px; height: 3px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }
  .bar-fill {
    width: 0%; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #ff9a3c, #ffd79a 60%, #fff3d6);
    box-shadow: 0 0 12px rgba(255, 160, 70, 0.85);
    transition: width 0.28s ease;
  }
  #loading .status { font-size: 12px; color: #7d8b9c; letter-spacing: 1.5px; height: 16px; }
  #loading .pct { font-size: 12px; color: #c8a97a; letter-spacing: 2px; }

  /* ============ HUD ============ */
  #hud {
    position: fixed; left: 26px; top: 22px; z-index: 10;
    pointer-events: none; opacity: 0;
    transition: opacity 1.4s ease 0.3s;
  }
  #hud.show { opacity: 1; }
  #hud .t {
    font-size: 17px; letter-spacing: 8px; color: #f2dcb6;
    text-shadow: 0 0 18px rgba(255, 150, 60, 0.55);
  }
  #hud .s {
    margin-top: 7px; font-size: 11px; letter-spacing: 2px; color: #8b93a3;
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="loading">
  <div class="brand">洪崖洞 · 夜</div>
  <div class="brand-sub">CHONGQING HONGYADONG</div>
  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  <div class="status" id="sub">正在准备场景…</div>
  <div class="pct" id="pct">0%</div>
</div>

<div id="hud">
  <div class="t">洪崖洞 · 夜</div>
  <div class="s">左键拖动旋转 · 滚轮缩放 · 右键平移</div>
</div>

<!-- 兜底提示：若 CDN 迟迟加载不出来，告诉用户原因，而不是一直卡在 0% -->
<script>
  window.__bootWatch = setTimeout(function () {
    if (!window.__threeLoaded) {
      var sub = document.getElementById('sub');
      if (sub) {
        sub.style.color = '#c96b5a';
        sub.textContent = '脚本初始化超时，请刷新页面重试';
      }
    }
  }, 15000);
</script>

    explodeY: [58, 92],       // 爆炸高度（取在洪崖洞屋顶之上、画面中上部）
    riseSpeed: [46, 62],      // 火箭上升初速范围
    gravity: 26,              // 粒子重力
    drag: 0.95,               // 空气阻力（每 1/60 秒衰减系数，越接近 1 爆炸开得越大）
    burst: [110, 170],        // 每次爆炸的粒子数
    palette: [0xffc25e, 0xff8b3d, 0xffe6b0, 0xff5f8a, 0x66e0ff, 0xb98cff],
  },
};

/* =========================================================================
 * 1. 通用工具函数
 * ========================================================================= */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** 创建离屏画布（所有贴图都由它程序化生成） */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}

/** 画布 → Three 贴图，默认按 sRGB 解释颜色 */
function canvasTexture(canvas, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  // 沿江面斜视建筑时，各向异性过滤能让窗格纹理不糊成一片
  t.anisotropy = renderer ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 4;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.generateMipmaps = true;
  return t;
}

/**
 * 按实际物理尺寸缩放 BoxGeometry 的 UV。
 * BoxGeometry 每个面 UV 都是 0~1，直接贴窗户会被拉伸；
 * 这里按「每 uUnit 米重复一次贴图」重算 UV（取整可避免接缝）。
 */
function scaleBoxUV(geo, w, h, d, uUnit, vUnit) {
  const uv = geo.attributes.uv;
  // 六个面：+x, -x, +y, -y, +z, -z
  const spanU = [d, d, w, w, w, w];
  const spanV = [h, h, d, d, h, h];
  for (let f = 0; f < 6; f++) {
    const ru = Math.max(1, Math.round(spanU[f] / uUnit));
    const rv = Math.max(1, Math.round(spanV[f] / vUnit));
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      if (i >= uv.count) break;
      uv.setXY(i, uv.getX(i) * ru, uv.getY(i) * rv);
    }
  }
  uv.needsUpdate = true;
  return geo;
}

/** 生成四坡屋顶几何（底边 w × d，高 h，底面位于 y=0） */
function makeRoofGeometry(w, d, h) {
  const g = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4, 1);
  g.rotateY(Math.PI / 4);       // 让方锥的边对齐 x / z 轴
  g.scale(w, h, d);             // 拉伸成需要的长宽高
  g.translate(0, h / 2, 0);     // 底面落到 y=0
  return g;
}

/** 生成两点之间的圆柱（用来做斜拉索 / 栏杆柱） */
const _v0 = new THREE.Vector3();
const _v1 = new THREE.Vector3();
const _q = new THREE.Quaternion();
const _up = new THREE.Vector3(0, 1, 0);
function cableGeometry(from, to, radius = 0.1) {
  _v0.copy(from);
  _v1.copy(to);
  const dir = new THREE.Vector3().subVectors(_v1, _v0);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(radius, radius, len, 4, 1, true);
  _q.setFromUnitVectors(_up, dir.normalize());
  g.applyQuaternion(_q);
  g.translate((_v0.x + _v1.x) / 2, (_v0.y + _v1.y) / 2, (_v0.z + _v1.z) / 2);
  return g;
}

/* =========================================================================
 * 2. 程序化贴图（全部用 Canvas 现画，零外部资源）
 * ========================================================================= */

/**
 * 吊脚楼墙面贴图
 * 返回 { map: 漫反射贴图, emiss: 自发光贴图 }
 * 自发光贴图只保留亮着的窗户，配合 emissiveMap 让窗户单独发光。
 */
function makeStiltTexture(opt) {
  const S = 256;
  const cols = opt.cols;
  const rows = opt.rows;
  const density = opt.density;
  const winColor = opt.win;
  const wallColor = opt.wall;

  const cAlbedo = makeCanvas(S, S);
  const cEmiss = makeCanvas(S, S);
  const a = cAlbedo.getContext('2d');
  const e = cEmiss.getContext('2d');

  // ---- 木质墙体 ----
  a.fillStyle = wallColor;
  a.fillRect(0, 0, S, S);

  // 木纹横条纹
  for (let y = 0; y < S; y += 7) {
    a.strokeStyle = 'rgba(0,0,0,' + rand(0.16, 0.34).toFixed(3) + ')';
    a.lineWidth = rand(1, 2);
    a.beginPath();
    a.moveTo(0, y + rand(-1, 1));
    a.lineTo(S, y + rand(-1, 1));
    a.stroke();
  }
  // 竖向立柱阴影
  for (let x = 0; x < S; x += S / cols) {
    a.fillStyle = 'rgba(0,0,0,0.22)';
    a.fillRect(x - 1, 0, 3, S);
  }
  // 局部受光（暖色渗光），让墙面不至于死黑
  const grad = a.createLinearGradient(0, S, 0, 0);
  grad.addColorStop(0, 'rgba(255,146,68,0.30)');
  grad.addColorStop(0.35, 'rgba(255,132,58,0.10)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  a.fillStyle = grad;
  a.fillRect(0, 0, S, S);

  // ---- 自发光底：纯黑 ----
  e.fillStyle = '#000000';
  e.fillRect(0, 0, S, S);

  // ---- 窗户阵列 ----
  const cw = S / cols;
  const ch = S / rows;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const x = i * cw;
      const y = j * ch;
      const w = cw * rand(0.56, 0.68);
      const h = ch * rand(0.5, 0.62);
      const px = x + (cw - w) / 2;
      const py = y + (ch - h) / 2;

      // 窗洞（暗部）
      a.fillStyle = '#0b0806';
      a.fillRect(px - 2, py - 2, w + 4, h + 4);

      if (Math.random() < density) {
        // 亮着的窗：漫反射 + 自发光同步绘制
        const bright = rand(0.72, 1.0);
        a.fillStyle = winColor;
        a.globalAlpha = bright;
        a.fillRect(px, py, w, h);
        a.globalAlpha = 1;

        e.fillStyle = winColor;
        e.globalAlpha = bright;
        e.fillRect(px, py, w, h);
        e.globalAlpha = 1;

        // 窗棂（十字格）
        a.fillStyle = 'rgba(45,24,10,0.8)';
        a.fillRect(px + w / 2 - 1, py, 2, h);
        a.fillRect(px, py + h / 2 - 1, w, 2);
        e.fillStyle = 'rgba(0,0,0,0.55)';
        e.fillRect(px + w / 2 - 1, py, 2, h);
        e.fillRect(px, py + h / 2 - 1, w, 2);
      } else {
        // 暗窗
        a.fillStyle = '#14100c';
        a.fillRect(px, py, w, h);
      }
    }
  }

  return { map: canvasTexture(cAlbedo), emiss: canvasTexture(cEmiss) };
}

/** 城市高楼的窗户贴图（随机方格灯光） */
function makeCityTexture() {
  const W = 64;
  const H = 128;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#05080c';
  ctx.fillRect(0, 0, W, H);

  const cols = 6;
  const rows = 16;
  const cw = W / cols;
  const ch = H / rows;

  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      if (Math.random() < 0.4) {
        const b = rand(0.45, 1);
        const warm = Math.random() < 0.72;
        ctx.fillStyle = warm
          ? 'rgba(255,' + Math.floor(186 + 50 * b) + ',' + Math.floor(112 + 70 * b) + ',' + b.toFixed(3) + ')'
          : 'rgba(170,214,255,' + (b * 0.8).toFixed(3) + ')';
        ctx.fillRect(i * cw + 1.4, j * ch + 1.4, cw - 2.8, ch - 2.8);
      }
    }
  }
  return canvasTexture(c);
}

/** 径向渐变光晕贴图（给 Sprite 做灯光的体积感） */
/**
 * 游船窗格贴图（程序化）：暗底 + 一排暖色小窗
 * 用它替代整条纯色发光块，远看才有"船舱亮灯"的层次
 */
/** 船底水中暗影贴图：横向长椭圆渐变，让船看起来是压在水面上，而不是凭空浮着 */
function makeBoatShadowTexture() {
  const c = makeCanvas(256, 128);
  const ctx = c.getContext('2d');
  ctx.save();
  ctx.translate(128, 64);
  ctx.scale(1, 0.46);                       // 压扁成椭圆，符合船的俯视投影
  ctx.translate(-128, -64);
  const g = ctx.createRadialGradient(128, 64, 6, 128, 64, 118);
  g.addColorStop(0, 'rgba(0,0,0,0.95)');
  g.addColorStop(0.42, 'rgba(0,0,0,0.58)');
  g.addColorStop(0.75, 'rgba(0,0,0,0.20)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-40, -110, 336, 336);
  ctx.restore();
  const tex = canvasTexture(c, false);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

function makeBoatWindowTexture() {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#12171f';
  g.fillRect(0, 0, 256, 64);
  const cols = 13;
  const padX = 6;
  const w = (256 - padX * (cols + 1)) / cols;
  for (let i = 0; i < cols; i++) {
    if (Math.random() < 0.12) continue; // 少量窗户熄灭，更真实
    const x = padX + i * (w + padX);
    g.fillStyle = i % 3 === 0 ? '#ffe6bd' : '#ffcf93';
    g.fillRect(x, 18, w, 26);
  }
  // 舱体上下留暗边，避免整条发白
  g.fillStyle = '#0f131a';
  g.fillRect(0, 0, 256, 12);
  g.fillRect(0, 52, 256, 12);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

function makeGlowTexture() {
  const S = 128;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.0, 'rgba(255,214,150,1)');
  g.addColorStop(0.28, 'rgba(255,168,86,0.45)');
  g.addColorStop(1.0, 'rgba(255,120,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return canvasTexture(c);
}

/** 通用柔光晕贴图：rgb 用 "r,g,b" 字符串传，中心亮、边缘完全透明 */
function makeSoftGlowTexture(rgb, core = 0.9) {
  const S = 256;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0.0, 'rgba(' + rgb + ',' + core + ')');
  g.addColorStop(0.22, 'rgba(' + rgb + ',' + core * 0.42 + ')');
  g.addColorStop(0.55, 'rgba(' + rgb + ',' + core * 0.12 + ')');
  g.addColorStop(1.0, 'rgba(' + rgb + ',0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  return canvasTexture(c);
}

/** 月盘贴图：暖白圆盘 + 环形山斑 + 柔边，让月亮不是一块死白 */
function makeMoonTexture() {
  const S = 512;
  const c = makeCanvas(S, S);
  const ctx = c.getContext('2d');
  const R = S / 2 - 8;
  // 球面明暗：左上偏亮，右下略暗
  const g = ctx.createRadialGradient(S * 0.40, S * 0.38, S * 0.03, S / 2, S / 2, R);
  // 亮度压在 Bloom 阈值下方一点，月面暗斑才不会被泛光糊成一片素白
  g.addColorStop(0.0, '#f0e9d6');
  g.addColorStop(0.5, '#e6ddc3');
  g.addColorStop(0.86, '#d7c9a6');
  g.addColorStop(1.0, '#c2b087');
  ctx.beginPath();
  ctx.arc(S / 2, S / 2, R, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();

  // 环形山 / 月海：只在圆内画
  ctx.save();
  ctx.beginPath();
  ctx.arc(S / 2, S / 2, R, 0, Math.PI * 2);
  ctx.clip();
  // 月海：几块大尺度暗区，让月面不是一片素白
  for (let i = 0; i < 7; i++) {
    const a = rand(0, Math.PI * 2);
    const rr = Math.sqrt(Math.random()) * R * 0.62;
    const x = S / 2 + Math.cos(a) * rr;
    const y = S / 2 + Math.sin(a) * rr;
    const rad = rand(58, 132);
    const mg = ctx.createRadialGradient(x, y, rad * 0.1, x, y, rad);
    mg.addColorStop(0, 'rgba(150,134,102,0.16)');
    mg.addColorStop(1, 'rgba(150,134,102,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }

  for (let i = 0; i < 110; i++) {
    const a = rand(0, Math.PI * 2);
    const rr = Math.sqrt(Math.random()) * R * 0.96;
    const x = S / 2 + Math.cos(a) * rr;
    const y = S / 2 + Math.sin(a) * rr;
    const rad = rand(5, 34);
    const cg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    cg.addColorStop(0, 'rgba(170,150,112,0.38)');
    cg.addColorStop(1, 'rgba(170,150,112,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // 边缘柔化：最外 5px 渐隐，避免锯齿硬边
  ctx.globalCompositeOperation = 'destination-in';
  const eg = ctx.createRadialGradient(S / 2, S / 2, R - 5, S / 2, S / 2, R);
  eg.addColorStop(0, 'rgba(0,0,0,1)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.arc(S / 2, S / 2, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  return canvasTexture(c);
}

/** 云朵贴图：一堆柔边光斑叠成棉絮，四边淡出防止出现方块边 */
function makeCloudTexture() {
  const W = 512;
  const H = 256;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const blobs = 44;
  for (let i = 0; i < blobs; i++) {
    const x = W * (0.12 + Math.random() * 0.76);
    const y = H * (0.40 + Math.random() * 0.32);
    const r = rand(16, 58);
    const cg = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = rand(0.06, 0.18);
    cg.addColorStop(0, 'rgba(206,224,255,' + a + ')');
    cg.addColorStop(1, 'rgba(206,224,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // 水平 + 垂直两次 destination-in，把四周压成完全透明
  ctx.globalCompositeOperation = 'destination-in';
  const hg = ctx.createLinearGradient(0, 0, W, 0);
  hg.addColorStop(0, 'rgba(0,0,0,0)');
  hg.addColorStop(0.2, 'rgba(0,0,0,1)');
  hg.addColorStop(0.8, 'rgba(0,0,0,1)');
  hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, H);
  const vg = ctx.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(0.22, 'rgba(0,0,0,1)');
  vg.addColorStop(0.72, 'rgba(0,0,0,1)');
  vg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  return canvasTexture(c);
}

/* =========================================================================
 * 3. 夜空环境组件 —— 天空球 + 星空 + 远山剪影
 *  想改夜色：调 CFG.color.skyTop / skyHorizon / skyGlow
 * ========================================================================= */
class NightEnvironment {
  constructor() {
    this.group = new THREE.Group();
    this.group.name = '夜空与环境';
    this._buildSkyDome();
    this._buildStars();
    this._buildMountains();
  }

  /** 渐变天空球：地平线偏暖（城市光污染），天顶深蓝近黑 */
  _buildSkyDome() {
    const geo = new THREE.SphereGeometry(1400, 32, 20);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uTop: { value: new THREE.Color(CFG.color.skyTop) },
        uHorizon: { value: new THREE.Color(CFG.color.skyHorizon) },
        uGlow: { value: new THREE.Color(CFG.color.skyGlow) },
      },
      vertexShader: /* glsl */ `
        varying vec3 vDir;
        void main() {
          vDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec3 uTop;
        uniform vec3 uHorizon;
        uniform vec3 uGlow;
        varying vec3 vDir;

        void main() {
          // y 分量 0(地平线) ~ 1(天顶)
          float h = clamp(vDir.y, 0.0, 1.0);
          vec3 col = mix(uHorizon, uTop, pow(h, 0.55));
          // 地平线附近的暖色光污染
          col += uGlow * pow(1.0 - h, 7.0);
          // 天顶轻微泛蓝
          col += vec3(0.01, 0.02, 0.045) * pow(h, 2.0);
          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });
    const dome = new THREE.Mesh(geo, mat);
    dome.renderOrder = -10;
    dome.frustumCulled = false;
    this.group.add(dome);
  }

  /** 星星：半球内随机撒点 */
  _buildStars() {
    const COUNT = 1300;
    const pos = new Float32Array(COUNT * 3);
    const R = 900;
    for (let i = 0; i < COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(rand(0.12, 1.0)); // 只在上半球
      const sinPhi = Math.sin(phi);
      pos[i * 3 + 0] = R * sinPhi * Math.cos(theta);
      pos[i * 3 + 1] = R * Math.cos(phi);
      pos[i * 3 + 2] = R * sinPhi * Math.sin(theta);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    const mat = new THREE.PointsMaterial({
      color: 0xcddfff,
      size: 1.7,
      sizeAttenuation: false,   // 星空用屏幕像素尺寸，远距离也不会缩成一个点
      transparent: true,
      opacity: 0.75,
      depthWrite: false,
      fog: false,
      blending: THREE.AdditiveBlending,
    });
    this.stars = new THREE.Points(geo, mat);
    this.stars.frustumCulled = false;
    this.group.add(this.stars);
  }

  /** 远山剪影：几个压扁的球体，被雾一糊就成了背景山脊 */
  _buildMountains() {
    const mat = new THREE.MeshBasicMaterial({ color: 0x0a1420, fog: true });
    const specs = [
      { p: [-150, -14, -230], s: [150, 62, 90] },
      { p: [60, -18, -260], s: [180, 78, 100] },
      { p: [240, -22, -240], s: [140, 58, 90] },
      { p: [-300, -26, -200], s: [130, 48, 80] },
    ];
    specs.forEach((sp) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), mat);
      m.position.set(sp.p[0], sp.p[1], sp.p[2]);
      m.scale.set(sp.s[0], sp.s[1], sp.s[2]);
      this.group.add(m);
    });
  }

  update(t) {
    // 星星缓慢闪烁
    if (this.stars) {
      this.stars.material.opacity = 0.62 + Math.sin(t * 0.7) * 0.12;
    }
  }
}

/* =========================================================================
 * 3.5 夜空装饰组件 —— 大圆月 / 流星 / 浮云
 *  都用 Sprite / Line 这类极轻的对象实现，新增 draw call 控制在 25 个以内
 *  想调大小、速度、亮度：改 CFG.sky
 * ========================================================================= */

/**
 * 大圆月：月盘 + 两层光晕
 * 用 Sprite 而不是 Plane，镜头怎么转月亮都正对观众、始终是正圆
 * depthTest 保持开启以便楼群正确遮挡月亮，depthWrite 关闭避免干扰透明排序
 */
class BigMoon {
  constructor() {
    const cfg = CFG.sky.moon;
    this.group = new THREE.Group();
    this.group.name = '大圆月';
    this.group.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);

    // 月盘本体
    this.disc = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeMoonTexture(),
      transparent: true,
      depthWrite: false,
      fog: false,
    }));
    this.disc.scale.set(cfg.size, cfg.size, 1);
    this.group.add(this.disc);

    // 内层暖晕：贴着月盘的一圈奶黄雾光
    this.warm = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeSoftGlowTexture('255,232,186', 0.85),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false,
      opacity: cfg.haloWarm,
    }));
    this.warm.scale.setScalar(cfg.size * 2.7);
    this.group.add(this.warm);

    // 外层冷晕：大一圈的淡蓝，把月色的通透感拉开
    this.cool = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeSoftGlowTexture('176,204,255', 0.55),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false,
      opacity: cfg.haloCool,
    }));
    this.cool.scale.setScalar(cfg.size * 5.6);
    this.group.add(this.cool);
  }

  update(t) {
    // 光晕极缓地呼吸：看得出"活"，但不会像在闪
    const p = Math.sin(t * 0.42) * 0.5 + 0.5;
    this.warm.material.opacity = CFG.sky.moon.haloWarm * (0.9 + p * 0.2);
    this.cool.material.opacity = CFG.sky.moon.haloCool * (1.1 - p * 0.2);
  }
}

/**
 * 流星：每道流星是一条 8 顶点的 Line
 * 靠顶点色从亮到暗做出"头亮尾淡"的拖尾，配合加色混合 + Bloom 自然发光
 */
class MeteorShower {
  constructor() {
    const cfg = CFG.sky.meteor;
    this.group = new THREE.Group();
    this.group.name = '流星';
    this.segs = 8;
    this.items = [];

    for (let i = 0; i < cfg.count; i++) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.segs * 3), 3));
      geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(this.segs * 3), 3));
      const mat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
      });
      const line = new THREE.Line(geo, mat);
      line.frustumCulled = false;
      line.visible = false;
      this.group.add(line);
      this.items.push({
        line, geo, mat,
        head: new THREE.Vector3(),
        dir: new THREE.Vector3(0, -1, 0),
        speed: 1, life: 0, maxLife: 1, trail: 100,
        delay: rand(0.4, 7.0),
      });
    }
  }

  /** 点火：从高处天空随机位置往斜下方划过 */
  _launch(it) {
    const cfg = CFG.sky.meteor;
    it.head.set(rand(-620, 620), rand(360, 580), rand(-240, -940));
    it.dir.set(rand(-0.55, 0.55), rand(-1.0, -0.6), rand(-0.35, 0.3)).normalize();
    it.speed = rand(cfg.speed[0], cfg.speed[1]);
    it.maxLife = rand(cfg.life[0], cfg.life[1]);
    it.life = it.maxLife;
    it.trail = rand(cfg.trail[0], cfg.trail[1]);
    it.line.visible = true;
  }

  update(t, dt) {
    const cfg = CFG.sky.meteor;
    for (const it of this.items) {
      // 冷却期：等待下一道
      if (it.life <= 0) {
        it.line.visible = false;
        it.delay -= dt;
        if (it.delay <= 0) this._launch(it);
        continue;
      }

      it.life -= dt;
      if (it.life <= 0) {
        it.line.visible = false;
        it.delay = rand(cfg.gap[0], cfg.gap[1]);
        continue;
      }

      it.head.addScaledVector(it.dir, it.speed * dt);

      const k = it.life / it.maxLife;
      // 两端淡入淡出：起飞瞬间和消失前都不会突兀
      const fade = Math.min(1, k * 2.6) * Math.min(1, (1 - k) * 5.5 + 0.18);

      const pos = it.geo.attributes.position.array;
      const col = it.geo.attributes.color.array;
      for (let s = 0; s < this.segs; s++) {
        const f = s / (this.segs - 1); // 0 = 头部，1 = 尾端
        const back = it.trail * f;
        pos[s * 3 + 0] = it.head.x - it.dir.x * back;
        pos[s * 3 + 1] = it.head.y - it.dir.y * back;
        pos[s * 3 + 2] = it.head.z - it.dir.z * back;
        const a = Math.pow(1 - f, 2.4) * fade * 1.6; // 尾巴平方衰减
        col[s * 3 + 0] = a * 0.82;
        col[s * 3 + 1] = a * 0.9;
        col[s * 3 + 2] = a;        // 冷白偏青
      }
      it.geo.attributes.position.needsUpdate = true;
      it.geo.attributes.color.needsUpdate = true;
      it.line.visible = true;
    }
  }
}

/**
 * 浮云：若干半透明 Sprite 在夜空里横向缓慢漂移
 * 贴图是 Canvas 现画的棉絮，越接近地平线越淡，不抢月亮和烟花的戏
 */
class CloudLayer {
  constructor() {
    const cfg = CFG.sky.clouds;
    this.group = new THREE.Group();
    this.group.name = '浮云';
    // 三张不同形状轮流用，避免一眼看出是同一片云复制出来的
    this.maps = [makeCloudTexture(), makeCloudTexture(), makeCloudTexture()];
    this.items = [];

    for (let i = 0; i < cfg.count; i++) {
      const w = rand(240, 580);
      const mat = new THREE.SpriteMaterial({
        map: this.maps[i % this.maps.length],
        transparent: true,
        depthWrite: false,
        fog: false,
        opacity: cfg.opacity * rand(0.55, 1.45),
        color: new THREE.Color().setHSL(0.58, 0.18, rand(0.52, 0.74)),
      });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(w, w * rand(0.34, 0.52), 1);
      sp.position.set(rand(-760, 760), rand(cfg.y[0], cfg.y[1]), rand(-880, -180));
      // 越远的云越淡：按 z 距离做一次衰减
      mat.opacity *= 0.7 + ((sp.position.z + 880) / 700) * 0.4;
      this.group.add(sp);
      this.items.push({
        sp, mat,
        speed: rand(cfg.speed[0], cfg.speed[1]),
        base: mat.opacity,
        phase: rand(0, Math.PI * 2),
      });
    }
  }

  update(t, dt) {
    for (const it of this.items) {
      it.sp.position.x += it.speed * dt;
      if (it.sp.position.x > 820) it.sp.position.x = -820;
      // 极缓的明暗起伏，像被地面灯火从下方映亮
      it.mat.opacity = it.base * (0.85 + Math.sin(t * 0.35 + it.phase) * 0.15);
    }
  }
}

/* =========================================================================
 * 4. 嘉陵江水面组件
 *  自定义 Shader：波纹 + 灯火倒影 + 菲涅尔 + 手写雾
 *  想改水面：调 uDeep / uShallow / uWarm，或改 fade 衰减系数
 * ========================================================================= */
class JialingRiver {
  constructor() {
    const geo = new THREE.PlaneGeometry(1400, 460, 1, 1);
    geo.rotateX(-Math.PI / 2);

    this.uniforms = {
      uTime: { value: 0 },
      uDeep: { value: new THREE.Color(0x081a2a) },
      uShallow: { value: new THREE.Color(0x10384a) },
      uSky: { value: new THREE.Color(0x16304a) },
      uWarm: { value: new THREE.Color(CFG.color.warm) },
      uFogColor: { value: new THREE.Color(CFG.fog.color) },
      uFogDensity: { value: CFG.fog.density },
    };

    const mat = new THREE.ShaderMaterial({
      uniforms: this.uniforms,
      transparent: false,
      vertexShader: /* glsl */ `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        precision highp float;

        uniform float uTime;
        uniform vec3 uDeep;
        uniform vec3 uShallow;
        uniform vec3 uSky;
        uniform vec3 uWarm;
        uniform vec3 uFogColor;
        uniform float uFogDensity;

        varying vec3 vWorldPos;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }
        float vnoise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 4; i++) {
            v += a * vnoise(p);
            p = p * 2.02 + vec2(1.7, 9.2);
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 p = vWorldPos.xz;
          float t = uTime;

          // ---- 两层流动噪声当作波纹 ----
          float n1 = fbm(p * 0.16 + vec2(t * 0.06, t * 0.028));
          float n2 = fbm(p * 0.63 - vec2(t * 0.17, t * 0.09));
          float ripple = n1 * 0.65 + n2 * 0.35;

          vec3 viewDir = normalize(cameraPosition - vWorldPos);
          float fres = pow(1.0 - clamp(viewDir.y, 0.0, 1.0), 2.2);

          // ---- 基础水色 ----
          vec3 col = mix(uDeep, uShallow, smoothstep(0.22, 0.85, ripple));
          col = mix(col, uSky, fres * 0.62);

          // ---- 洪崖洞灯火倒影 ----
          // 岸线在 z = -78 附近，越往外越淡
          float shoreZ = -78.0;
          float dShore = max(vWorldPos.z - shoreZ, 0.0);
          float fade = exp(-dShore / 34.0);

          // 每一列灯火的强弱：模拟建筑疏密，避免整片等亮度的死板条纹
          float colNoise = fbm(vec2(vWorldPos.x * 0.075, 3.7));
          float colMask = smoothstep(0.30, 0.78, colNoise);

          // 两个尺度的水波扰动，把笔直的灯柱揉成碎影
          float wob1 = fbm(vec2(vWorldPos.x * 0.22, dShore * 0.085 - t * 0.30));
          float wob2 = fbm(vec2(vWorldPos.x * 0.55 + 11.0, dShore * 0.155 - t * 0.55));

          // 灯柱：x 方向高频决定灯柱宽度，相位被噪声推挤，所以不可能出现等距直线
          float pillar = sin(vWorldPos.x * 0.26 + wob1 * 2.6 + wob2 * 1.4);
          pillar = pow(pillar * 0.5 + 0.5, 2.4);

          // 水面波纹沿 z 方向把灯柱一节一节切断（消除“条形码”观感的关键）
          float chopPattern = fbm(vec2(vWorldPos.x * 0.30 + wob2 * 1.5, dShore * 0.62 - t * 0.85));
          float chopMask = smoothstep(0.34, 0.72, chopPattern + 0.18);
          pillar *= 0.22 + 0.78 * chopMask;

          // 横向范围与吊脚楼群同宽（半宽约 62），边缘柔和渐隐
          float xMask = 1.0 - smoothstep(50.0, 116.0, abs(vWorldPos.x));
          float refl = pillar * colMask * fade * xMask * (0.40 + 1.0 * ripple);

          // ---- 水面碎光点 ----
          float sparkle = pow(smoothstep(0.72, 1.0, vnoise(p * 3.2 + t * 0.45)), 3.0);
          refl += sparkle * fade * 0.45;

          col += uWarm * refl * 0.85;

          // ---- 与场景一致的指数雾 ----
          float dist = length(cameraPosition - vWorldPos);
          float f = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
          col = mix(col, uFogColor, clamp(f, 0.0, 1.0));

          gl_FragColor = vec4(col, 1.0);
        }
      `,
    });

    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.name = '嘉陵江水面';
    this.mesh.position.set(0, 0, 10);
  }

  update(t) {
    this.uniforms.uTime.value = t;
  }
}

/* =========================================================================
 * 5. 洪崖洞吊脚楼群组件（场景主角）
 *  结构：9 层台地，每层若干栋楼，越往上越靠后、越窄，形成层层叠叠
 *  想改建筑：调 LEVELS / LEVEL_H / Z_STEP / 窗贴图配色
 *  性能：所有楼体按 3 组材质合并几何，整片建筑只有 3 个 draw call
 * ========================================================================= */
const TEX_SETS = [
  { cols: 4, rows: 4, density: 0.86, win: '#ffcf87', wall: '#2b1e15' },
  { cols: 3, rows: 4, density: 0.74, win: '#ffb35c', wall: '#241a13' },
  { cols: 5, rows: 4, density: 0.8, win: '#ffd79a', wall: '#302318' },
];

class StiltHouseComplex {
  constructor() {
    this.group = new THREE.Group();
    this.group.name = '洪崖洞吊脚楼群';
    this._build();
  }

  _build() {
    const LEVELS = 9;      // 台地层数
    const LEVEL_H = 7.6;   // 每层台地高度
    const START_Z = -78;   // 最底层台地前沿 z
    const Z_STEP = 6.6;    // 每往上一层向后退的距离

    const textures = TEX_SETS.map((s) => makeStiltTexture(s));
    const bodyGeos = [[], [], []]; // 三组楼体几何
    const roofGeos = [];
    const terraceGeos = [];
    const ledGeos = [];            // 金色灯带
    const lampPts = [];            // 灯笼位置

    for (let lv = 0; lv < LEVELS; lv++) {
      const baseY = lv * LEVEL_H;
      const frontZ = START_Z - lv * Z_STEP;
      const halfW = 62 - lv * 4.8;                       // 越往上越窄
      const count = Math.max(2, Math.round(7 - lv * 0.52)); // 越往上越少

      // ---------- 台地 / 挡土墙 ----------
      const tg = new THREE.BoxGeometry(halfW * 2 + 12, LEVEL_H, 17);
      tg.translate(0, baseY + LEVEL_H / 2, frontZ - 8.5);
      terraceGeos.push(tg);

      // ---------- 每层放若干栋吊脚楼 ----------
      const slotW = (halfW * 2) / count;
      for (let i = 0; i < count; i++) {
        const cx = -halfW + slotW * (i + 0.5) + rand(-1.0, 1.0);
        const bw = slotW * rand(0.6, 0.88);   // 楼宽
        const bd = rand(8, 11.5);             // 楼深
        const bh = rand(5, 8.6);              // 楼高
        const cz = frontZ - 8 + rand(-2.2, 1.8);
        const topY = baseY + LEVEL_H + bh;

        // 楼体
        const bg = new THREE.BoxGeometry(bw, bh, bd);
        scaleBoxUV(bg, bw, bh, bd, 7.5, 7.5);
        bg.translate(cx, baseY + LEVEL_H + bh / 2, cz);
        bodyGeos[randInt(0, 2)].push(bg);

        // 四坡屋顶
        const roofH = rand(1.8, 2.9);
        const rg = makeRoofGeometry(bw * 1.32, bd * 1.28, roofH);
        rg.translate(cx, topY, cz);
        roofGeos.push(rg);

        // 金色轮廓灯带（正面檐口 + 左右竖边）—— 洪崖洞的标志性金色勾边
        const faceZ = cz + bd / 2 + 0.16;
        let lg = new THREE.BoxGeometry(bw + 0.34, 0.18, 0.18);
        lg.translate(cx, topY - 0.12, faceZ);
        ledGeos.push(lg);

        lg = new THREE.BoxGeometry(0.18, bh, 0.18);
        lg.translate(cx - bw / 2, topY - bh / 2, faceZ);
        ledGeos.push(lg);

        lg = new THREE.BoxGeometry(0.18, bh, 0.18);
        lg.translate(cx + bw / 2, topY - bh / 2, faceZ);
        ledGeos.push(lg);

        // 檐下红灯笼
        const lampCount = randInt(1, 3);
        for (let k = 0; k < lampCount; k++) {
          lampPts.push(new THREE.Vector3(
            cx + rand(-bw * 0.42, bw * 0.42),
            topY - rand(1.0, 2.4),
            faceZ + rand(0.25, 0.7)
          ));
        }
      }
    }

    // ---------- 合并楼体（3 组材质） ----------
    bodyGeos.forEach((arr, i) => {
      if (!arr.length) return;
      const merged = BufferGeometryUtils.mergeGeometries(arr, false);
      arr.forEach((g) => g.dispose());
      const mat = new THREE.MeshStandardMaterial({
        map: textures[i].map,
        emissiveMap: textures[i].emiss,
        emissive: new THREE.Color(0xffb25e),
        emissiveIntensity: 1.02,
        roughness: 0.95,
        metalness: 0.0,
      });
      const mesh = new THREE.Mesh(merged, mat);
      mesh.name = '吊脚楼体_' + i;
      this.group.add(mesh);
    });

    // ---------- 合并屋顶 ----------
    if (roofGeos.length) {
      const mergedRoof = BufferGeometryUtils.mergeGeometries(roofGeos, false);
      roofGeos.forEach((g) => g.dispose());
      const roofMat = new THREE.MeshStandardMaterial({
        color: 0x2a2b36,
        roughness: 0.96,
        metalness: 0.04,
      });
      this.group.add(new THREE.Mesh(mergedRoof, roofMat));
    }

    // ---------- 合并台地 ----------
    if (terraceGeos.length) {
      const mergedTerrace = BufferGeometryUtils.mergeGeometries(terraceGeos, false);
      terraceGeos.forEach((g) => g.dispose());
      const terraceMat = new THREE.MeshStandardMaterial({
        color: 0x15171e,
        roughness: 1.0,
        metalness: 0.0,
      });
      this.group.add(new THREE.Mesh(mergedTerrace, terraceMat));
    }

    // ---------- 合并金色灯带 ----------
    if (ledGeos.length) {
      const mergedLed = BufferGeometryUtils.mergeGeometries(ledGeos, false);
      ledGeos.forEach((g) => g.dispose());
      // 颜色值故意大于 1，交给 Bloom 去发光
      const ledMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(0xffbe74).multiplyScalar(1.55),
      });
      this.group.add(new THREE.Mesh(mergedLed, ledMat));
    }

    // ---------- 灯笼（InstancedMesh，一次 draw call） ----------
    if (lampPts.length) {
      const lampGeo = new THREE.SphereGeometry(0.34, 6, 5);
      const lampMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(0xffb46a).multiplyScalar(1.5),
      });
      const lamps = new THREE.InstancedMesh(lampGeo, lampMat, lampPts.length);
      const dummy = new THREE.Object3D();
      lampPts.forEach((p, i) => {
        dummy.position.copy(p);
        dummy.scale.setScalar(rand(0.85, 1.25));
        dummy.updateMatrix();
        lamps.setMatrixAt(i, dummy.matrix);
      });
      lamps.instanceMatrix.needsUpdate = true;
      lamps.name = '灯笼';
      this.group.add(lamps);
    }

    // ---------- 灯光体积感光晕（Sprite） ----------
    const glowTex = makeGlowTexture();
    for (let i = 0; i < 7; i++) {
      const sm = new THREE.SpriteMaterial({
        map: glowTex,
        color: CFG.color.warmDeep,
        transparent: true,
        opacity: rand(0.14, 0.26),
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const sp = new THREE.Sprite(sm);
      sp.position.set(rand(-58, 58), rand(6, 46), rand(-72, -54));
      sp.scale.setScalar(rand(22, 48));
      this.group.add(sp);
    }

    // ---------- 岸线护岸（让水陆交界不出现生硬直线） ----------
    this._buildEmbankment();
  }

  /**
   * 江岸护岸：一段暗色石墙 + 石阶 + 步道灯带
   * 想改岸线：调 shoreZ（岸线位置）、墙高、灯带亮度
   */
  _buildEmbankment() {
    const shoreZ = -78;

    // 主体石墙（略微伸到水里，底部被水面遮住）
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x171c23,
      roughness: 0.96,
      metalness: 0.04,
    });
    const wall = new THREE.Mesh(new THREE.BoxGeometry(156, 4.2, 5), wallMat);
    wall.position.set(0, 0.9, shoreZ - 0.6);
    this.group.add(wall);

    // 墙顶步道（浅一档的色调，形成一道水平带）
    const pathMat = new THREE.MeshStandardMaterial({
      color: 0x2a2b2c,
      roughness: 0.9,
    });
    const path = new THREE.Mesh(new THREE.BoxGeometry(156, 0.35, 6.4), pathMat);
    path.position.set(0, 3.05, shoreZ - 0.2);
    this.group.add(path);

    // 栏杆灯带：一条连续暖光线，勾出岸线
    const railMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xffbe78).multiplyScalar(1.05),
    });
    const rail = new THREE.Mesh(new THREE.BoxGeometry(156, 0.12, 0.12), railMat);
    rail.position.set(0, 4.1, shoreZ + 2.4);
    this.group.add(rail);

    // 沿岸灯柱（InstancedMesh，一次 draw call）
    const count = 26;
    const poleGeo = new THREE.CylinderGeometry(0.09, 0.11, 3.0, 5);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x14181e, roughness: 0.9 });
    const poles = new THREE.InstancedMesh(poleGeo, poleMat, count);
    const bulbGeo = new THREE.SphereGeometry(0.3, 6, 5);
    const bulbs = new THREE.InstancedMesh(bulbGeo, railMat, count);
    const d = new THREE.Object3D();
    for (let i = 0; i < count; i++) {
      const x = -78 + (i / (count - 1)) * 156;
      d.position.set(x, 4.4, shoreZ + 2.4);
      d.updateMatrix();
      poles.setMatrixAt(i, d.matrix);
      d.position.set(x, 5.9, shoreZ + 2.4);
      d.updateMatrix();
      bulbs.setMatrixAt(i, d.matrix);
    }
    poles.instanceMatrix.needsUpdate = true;
    bulbs.instanceMatrix.needsUpdate = true;
    bulbs.name = '岸灯';
    this.group.add(poles, bulbs);
  }
}

/* =========================================================================
 * 6. 千厮门大桥组件（红色斜拉桥，横跨江面）
 *  想改：X 桥的横向位置 / DECK_Y 桥面高度 / TOWER_Y 桥塔高度
 * ========================================================================= */
class QiansimenBridge {
  constructor() {
    this.X = 86;        // 桥在 x 轴上的位置（画面右侧）
    this.DECK_Y = 17;   // 桥面高度
    this.Z_FAR = -150;  // 桥的远端 z
    this.Z_NEAR = 2;    // 桥的近端 z（保持在画面右侧，避免桥面从镜头旁切入）
    this.TOWERS = [-16, -92]; // 两座桥塔的 z 坐标
    this.TOWER_H = 52;  // 桥塔高度

    this.group = new THREE.Group();
    this.group.name = '千厮门大桥';
    this._build();
  }

  _build() {
    const X = this.X;
    const deckLen = this.Z_NEAR - this.Z_FAR + 20;
    const deckCenterZ = (this.Z_NEAR + this.Z_FAR) / 2;

    // ---------- 桥面 ----------
    const deckMat = new THREE.MeshStandardMaterial({
      color: 0x3a3d47,
      roughness: 0.9,
      metalness: 0.2,
    });
    const deck = new THREE.Mesh(new THREE.BoxGeometry(16, 1.8, deckLen), deckMat);
    deck.position.set(X, this.DECK_Y, deckCenterZ);
    this.group.add(deck);

    // 桥面侧边（红色箱梁外皮）
    const redMat = new THREE.MeshStandardMaterial({
      color: 0x9c3a2a,
      roughness: 0.72,
      metalness: 0.28,
      emissive: new THREE.Color(0x4a1109),
      emissiveIntensity: 1.1,
    });
    [-1, 1].forEach((side) => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.2, deckLen), redMat);
      rail.position.set(X + side * 7.4, this.DECK_Y + 1.2, deckCenterZ);
      this.group.add(rail);
    });

    // ---------- 水中桥墩 ----------
    const pierMat = new THREE.MeshStandardMaterial({ color: 0x24262e, roughness: 0.95 });
    [10, -55, -125].forEach((z) => {
      const pier = new THREE.Mesh(new THREE.BoxGeometry(9, this.DECK_Y, 7), pierMat);
      pier.position.set(X, this.DECK_Y / 2, z);
      this.group.add(pier);
    });

    // ---------- 两座桥塔（H 形） ----------
    const towerGeos = [];
    this.TOWERS.forEach((z) => {
      [-1, 1].forEach((side) => {
        const g = new THREE.BoxGeometry(3.6, this.TOWER_H, 4.4);
        g.translate(X + side * 7.6, this.TOWER_H / 2, z);
        towerGeos.push(g);
      });
      // 顶部横梁
      const beam = new THREE.BoxGeometry(19, 3.4, 4.4);
      beam.translate(X, this.TOWER_H - 3.2, z);
      towerGeos.push(beam);
      // 中部横梁
      const beam2 = new THREE.BoxGeometry(19, 2.2, 3.6);
      beam2.translate(X, this.TOWER_H * 0.52, z);
      towerGeos.push(beam2);
    });

    const towerMerged = BufferGeometryUtils.mergeGeometries(towerGeos, false);
    towerGeos.forEach((g) => g.dispose());
    this.group.add(new THREE.Mesh(towerMerged, redMat));

    // ---------- 斜拉索 ----------
    const cableGeos = [];
    this.TOWERS.forEach((tz) => {
      [-1, 1].forEach((side) => {
        const anchorX = X + side * 7.6;
        const top = new THREE.Vector3(anchorX, this.TOWER_H - 6, tz);
        for (let k = 1; k <= 8; k++) {
          // 向远端与近端各拉一组
          [1, -1].forEach((dir) => {
            const dz = tz + dir * k * 9.2;
            if (dz < this.Z_FAR || dz > this.Z_NEAR) return;
            const bottom = new THREE.Vector3(anchorX, this.DECK_Y + 2.4, dz);
            cableGeos.push(cableGeometry(top, bottom, 0.14));
          });
        }
      });
    });

    if (cableGeos.length) {
      const cableMerged = BufferGeometryUtils.mergeGeometries(cableGeos, false);
      cableGeos.forEach((g) => g.dispose());
      const cableMat = new THREE.MeshStandardMaterial({
        color: 0xd9cfc4,
        roughness: 0.5,
        metalness: 0.5,
        emissive: new THREE.Color(0x3a2a16),
        emissiveIntensity: 0.8,
      });
      this.group.add(new THREE.Mesh(cableMerged, cableMat));
    }

    // ---------- 桥面路灯（InstancedMesh） ----------
    const lampCount = 26;
    const lampGeo = new THREE.SphereGeometry(0.55, 6, 5);
    const lampMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xffe0a8).multiplyScalar(2.6),
    });
    const lamps = new THREE.InstancedMesh(lampGeo, lampMat, lampCount);
    const dummy = new THREE.Object3D();
    for (let i = 0; i < lampCount; i++) {
      const z = this.Z_NEAR - 6 - (i / (lampCount - 1)) * (deckLen - 12);
      dummy.position.set(X + (i % 2 === 0 ? -7.2 : 7.2), this.DECK_Y + 4.2, z);
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      lamps.setMatrixAt(i, dummy.matrix);
    }
    lamps.instanceMatrix.needsUpdate = true;
    this.group.add(lamps);

    // ---------- 桥上车流（夜间小光点） ----------
    this.carData = [];
    for (let i = 0; i < 20; i++) {
      this.carData.push({
        z0: rand(0, deckLen),
        speed: rand(14, 26) * (i % 2 === 0 ? 1 : -1),
        lane: (i % 2 === 0 ? -1 : 1) * rand(1.8, 5.2),
        len: deckLen,
      });
    }
    const carGeo = new THREE.BoxGeometry(1.4, 0.7, 2.6);
    const carMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    this.cars = new THREE.InstancedMesh(carGeo, carMat, this.carData.length);
    this.cars.instanceColor = new THREE.InstancedBufferAttribute(
      new Float32Array(this.carData.length * 3), 3
    );
    const cWhite = new THREE.Color(0xfff0d0).multiplyScalar(2.2);
    const cRed = new THREE.Color(0xff5533).multiplyScalar(2.2);
    this.carData.forEach((d, i) => {
      this.cars.setColorAt(i, d.speed > 0 ? cWhite : cRed);
    });
    this.cars.instanceColor.needsUpdate = true;
    this.group.add(this.cars);

    this._dummy = new THREE.Object3D();
    this._deckCenterZ = deckCenterZ;
  }

  update(t) {
    const d = this._dummy;
    for (let i = 0; i < this.carData.length; i++) {
      const car = this.carData[i];
      const span = car.len;
      let z = (car.z0 + car.speed * t) % span;
      if (z < 0) z += span;
      z = this.Z_NEAR - z;
      d.position.set(this.X + car.lane, this.DECK_Y + 1.6, z);
      d.rotation.set(0, 0, 0);
      d.scale.set(1, 1, 1);
      d.updateMatrix();
      this.cars.setMatrixAt(i, d.matrix);
    }
    this.cars.instanceMatrix.needsUpdate = true;
  }
}

/* =========================================================================
 * 7. 远处城市楼群组件（渝中半岛天际线）
 *  技术上用 InstancedMesh，几百栋楼只有 3 个 draw call
 * ========================================================================= */
class CitySkyline {
  constructor() {
    this.group = new THREE.Group();
    this.group.name = '远处城市楼群';
    this._build();
  }

  _build() {
    // 三个层次：近层亮暖、中层中等、远层暗冷（靠色调+雾做大气透视，避免天际线扁平）
    const groups = [
      { count: 95, texRepeat: [2, 3], size: [9, 22, 9], height: [30, 95],
        zNear: -170, zFar: -250, xRange: 300, glow: 1.9, tint: 0xffd7a8, base: 0x424a5a },
      { count: 85, texRepeat: [3, 4], size: [12, 26, 12], height: [40, 115],
        zNear: -250, zFar: -340, xRange: 380, glow: 0.95, tint: 0xffc48a, base: 0x2f3542 },
      { count: 90, texRepeat: [1.6, 2.4], size: [8, 20, 8], height: [25, 80],
        zNear: -340, zFar: -450, xRange: 470, glow: 0.5, tint: 0xa8b8cc, base: 0x222833 },
    ];

    groups.forEach((g) => {
      const tex = makeCityTexture();
      tex.repeat.set(g.texRepeat[0], g.texRepeat[1]);

      const mat = new THREE.MeshStandardMaterial({
        map: tex,
        emissiveMap: tex,
        emissive: new THREE.Color(g.tint),
        emissiveIntensity: g.glow,
        color: g.base,
        roughness: 0.95,
        metalness: 0.05,
      });

      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mesh = new THREE.InstancedMesh(geo, mat, g.count);
      const dummy = new THREE.Object3D();

      for (let i = 0; i < g.count; i++) {
        const w = rand(g.size[0], g.size[1]);
        const d = rand(g.size[0], g.size[1]);

        // 靠近洪崖洞正后方的楼压低一些，避免完全挡住吊脚楼
        let h = rand(g.height[0], g.height[1]);
        const x = rand(-g.xRange, g.xRange);
        const z = rand(g.zFar, g.zNear);
        const nearHouse = Math.abs(x) < 100 && z > -230;
        if (nearHouse) h *= 0.45;

        dummy.position.set(x, h / 2, z);
        dummy.scale.set(w, h, d);
        dummy.rotation.y = rand(0, Math.PI * 0.25);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.frustumCulled = true;
      this.group.add(mesh);
    });
  }
}

/* =========================================================================
 * 8. 游船组件（江面往来）
 *  想改：range 航行范围 / speed 航速 / z 离岸距离 / scale 大小
 * ========================================================================= */
class CruiseBoat {
  constructor(opts = {}) {
    this.range = opts.range ?? 75;
    this.speed = opts.speed ?? 4.2;
    this.phase = opts.phase ?? 0;
    this.z = opts.z ?? -30;
    this.scaleValue = opts.scale ?? 1;

    this.group = new THREE.Group();
    this.group.name = '游船';
    this._build();
    this.group.scale.setScalar(this.scaleValue);
  }

  _build() {
    const hullMat = new THREE.MeshStandardMaterial({
      color: 0x8f9aa8,
      roughness: 0.55,
      metalness: 0.15,
      emissive: new THREE.Color(0x2c3646),
      emissiveIntensity: 0.7,
    });
    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x1b222c,
      roughness: 0.8,
      metalness: 0.2,
    });
    // 窗光：用窗格贴图替代纯色发光块，避免整船发白
    const winMat = new THREE.MeshBasicMaterial({
      map: makeBoatWindowTexture(),
      color: new THREE.Color(0xfff0d6).multiplyScalar(1.02),
    });
    // 腰线灯带：细窄暗暖光，只勾轮廓
    const waistMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xffc48a).multiplyScalar(0.95),
    });

    // 主船体（长边沿 x 轴，船头朝 +x）
    const hull = new THREE.Mesh(new THREE.BoxGeometry(9.5, 1.5, 3.2), hullMat);
    hull.position.y = 0.6;
    this.group.add(hull);

    // 船底吃水
    const keel = new THREE.Mesh(new THREE.BoxGeometry(9.9, 0.5, 3.4), darkMat);
    keel.position.y = -0.16;
    this.group.add(keel);

    // 船头：四棱锥削尖（尖朝 +x），比单纯方块更像船首
    const bowGeo = new THREE.ConeGeometry(1.9, 3.2, 4);
    bowGeo.rotateY(Math.PI / 4);
    bowGeo.rotateZ(-Math.PI / 2);
    bowGeo.scale(1, 0.62, 0.62);
    const bow = new THREE.Mesh(bowGeo, hullMat);
    bow.position.set(5.6, 0.62, 0);
    this.group.add(bow);

    // 船身腰线灯带（一圈暖光，远看能看到船的轮廓）
    const waist = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.1, 3.28), waistMat);
    waist.position.set(0, 1.32, 0);
    this.group.add(waist);

    // 一层客舱
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(6.6, 1.7, 2.9), hullMat);
    cabin.position.set(-0.3, 2.1, 0);
    this.group.add(cabin);

    // 客舱窗带（自发光）
    const win = new THREE.Mesh(new THREE.BoxGeometry(6.7, 0.62, 2.94), winMat);
    win.position.set(-0.3, 2.25, 0);
    this.group.add(win);

    // 顶层观景台
    const top = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.15, 2.3), hullMat);
    top.position.set(-0.7, 3.5, 0);
    this.group.add(top);

    const topWin = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.4, 2.34), winMat);
    topWin.position.set(-0.7, 3.6, 0);
    this.group.add(topWin);

    // 顶层遮阳篷（薄板，比顶层稍大形成檐口）
    const canopy = new THREE.Mesh(
      new THREE.BoxGeometry(4.9, 0.1, 2.7),
      new THREE.MeshStandardMaterial({ color: 0x2b3542, roughness: 0.9 })
    );
    canopy.position.set(-0.7, 4.12, 0);
    this.group.add(canopy);

    // 露天甲板围栏：四条发光细杆，夜景中形成一圈船形灯边
    const railMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0xffd9a0).multiplyScalar(0.95),
    });
    const railX = new THREE.BoxGeometry(4.9, 0.07, 0.07);
    const railZ = new THREE.BoxGeometry(0.07, 0.07, 2.7);
    [-1.32, 1.32].forEach((z) => {
      const r = new THREE.Mesh(railX, railMat);
      r.position.set(-0.7, 4.34, z);
      this.group.add(r);
    });
    [-3.12, 1.72].forEach((x) => {
      const r = new THREE.Mesh(railZ, railMat);
      r.position.set(x, 4.34, 0);
      this.group.add(r);
    });

    // 桅杆与顶灯
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.4, 5), darkMat);
    mast.position.set(-1.4, 5.2, 0);
    this.group.add(mast);

    const beacon = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 8, 6),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(0xfff3d6).multiplyScalar(3) })
    );
    beacon.position.set(-1.4, 6.5, 0);
    this.group.add(beacon);

    // 船头信号灯
    const bowLight = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 6, 5),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(0xff8866).multiplyScalar(2.4) })
    );
    bowLight.position.set(6.2, 1.5, 0);
    this.group.add(bowLight);

    // 船体在水中的倒影光斑
    const glowTex = makeGlowTexture();
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex,
      color: 0xffb060,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    }));
    glow.position.set(0, 2.4, 0);
    // group 整体缩放会同时放大 Sprite，这里按比例反向补偿，避免光晕变成大白团
    glow.scale.setScalar(13 / this.scaleValue);
    this.group.add(glow);

    // 水中暗影：叠在水面上方一点点，遮住"船体直接切进水面"的硬边
    const shadow = new THREE.Mesh(
      new THREE.PlaneGeometry(13.2, 6.6),
      new THREE.MeshBasicMaterial({
        map: makeBoatShadowTexture(),
        color: 0x060b11,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
      })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.set(0.1, 0.12, 0);
    shadow.renderOrder = 1;
    this.group.add(shadow);
  }

  update(t) {
    const span = this.range * 2;
    const period = span * 2;
    const d = ((t * this.speed + this.phase * period) % period + period) % period;

    let x;
    let dir;
    if (d < span) {
      x = -this.range + d;
      dir = 1;
    } else {
      x = this.range - (d - span);
      dir = -1;
    }

    this.group.position.set(x, Math.sin(t * 0.9 + this.phase * 7) * 0.09, this.z);
    this.group.rotation.y = dir > 0 ? 0 : Math.PI;
    this.group.rotation.z = Math.sin(t * 0.65 + this.phase * 3) * 0.014;
  }
}

/* =========================================================================
 * 8.5 烟花组件 —— 从江畔地面向上燃放
 *  火箭上升带拖尾，到顶球面炸开；全部粒子共用一套 Points + 自定义 Shader，
 *  1 个 draw call 撑起上千粒子，笔记本上几乎无感。
 *  想改密度/节奏/配色：CFG.fireworks
 * ========================================================================= */
class Fireworks {
  constructor() {
    const cfg = CFG.fireworks;
    this.cfg = cfg;
    this.cap = cfg.capacity;
    this.group = new THREE.Group();
    this.group.name = '地面烟花';

    // ---- CPU 侧粒子状态：全部用定长 Float32Array，避免上万个小对象拖垮 GC ----
    this.pos = new Float32Array(this.cap * 3);
    this.vel = new Float32Array(this.cap * 3);
    this.col = new Float32Array(this.cap * 3);
    this.size = new Float32Array(this.cap);
    this.baseSize = new Float32Array(this.cap);
    this.alpha = new Float32Array(this.cap);
    this.life = new Float32Array(this.cap);
    this.maxLife = new Float32Array(this.cap);
    this.cursor = 0;   // 环形游标：池子满了就覆盖最早的粒子

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1));
    // 固定包围球，省掉每帧重算包围盒
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 70, 0), 1200);

    const mat = new THREE.ShaderMaterial({
      vertexShader: [
        'attribute float aSize;',
        'attribute float aAlpha;',
        'attribute vec3 aColor;',
        'varying float vA;',
        'varying vec3 vC;',
        'void main() {',
        '  vA = aAlpha;',
        '  vC = aColor;',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = aSize * (420.0 / max(-mv.z, 1.0));', // 透视衰减：远处粒子自动变小
        '  gl_Position = projectionMatrix * mv;',
        '}',
      ].join('\n'),
      fragmentShader: [
        'varying float vA;',
        'varying vec3 vC;',
        'void main() {',
        '  float d = length(gl_PointCoord - vec2(0.5));',
        '  if (d > 0.5) discard;',
        '  float a = smoothstep(0.5, 0.02, d);',
        '  a *= a;',                                    // 软边，避免方块粒子
        '  gl_FragColor = vec4(vC * (1.0 + vA * 0.9), a * vA);', // 提亮，交给 Bloom 出光晕
        '}',
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    this.geo = geo;
    this.group.add(this.points);

    this.rockets = [];                  // 正在升空的火箭
    this.timer = rand(0.5, 1.5);        // 首枚发射倒计时
    this._trailColor = new THREE.Color(0xffd9a0);
    this._tmpColor = new THREE.Color();
  }

  /** 取一个空槽位（环形复用） */
  _slot() {
    const i = this.cursor;
    this.cursor = (this.cursor + 1) % this.cap;
    return i;
  }

  /** 生成一个粒子 */
  _emit(x, y, z, vx, vy, vz, color, size, life) {
    const i = this._slot();
    const p = i * 3;
    this.pos[p] = x; this.pos[p + 1] = y; this.pos[p + 2] = z;
    this.vel[p] = vx; this.vel[p + 1] = vy; this.vel[p + 2] = vz;
    this.col[p] = color.r; this.col[p + 1] = color.g; this.col[p + 2] = color.b;
    this.baseSize[i] = size;
    this.size[i] = size;
    this.alpha[i] = 1;
    this.life[i] = life;
    this.maxLife[i] = life;
  }

  /** 从地面随机点放一枚火箭 */
  _launch() {
    const cfg = this.cfg;
    const box = cfg.launchBox;
    this.rockets.push({
      pos: new THREE.Vector3(rand(box.x[0], box.x[1]), 1.5, rand(box.z[0], box.z[1])),
      vy: rand(cfg.riseSpeed[0], cfg.riseSpeed[1]),
      targetY: rand(cfg.explodeY[0], cfg.explodeY[1]),
      color: new THREE.Color(cfg.palette[randInt(0, cfg.palette.length - 1)]),
      trail: 0,
    });
  }

  /** 炸开：球面均匀撒粒子 + 一团短命亮芯 */
  _burst(r) {
    const cfg = this.cfg;
    const n = randInt(cfg.burst[0], cfg.burst[1]);
    const c = this._tmpColor;

    for (let i = 0; i < n; i++) {
      // 球面均匀分布（z 轴均匀 + 环向均匀），炸开才是标准球形而不是饼状
      const cz = rand(-1, 1);
      const phi = rand(0, Math.PI * 2);
      const rxy = Math.sqrt(1 - cz * cz);
      const sp = rand(34, 68) * rand(0.7, 1.15);

      if (Math.random() < 0.2) {
        c.set(0xfff0d0);                                     // 掺一点暖白，层次更足
      } else {
        c.copy(r.color).offsetHSL(rand(-0.05, 0.05), rand(-0.1, 0.1), rand(-0.08, 0.12));
      }

      this._emit(
        r.pos.x, r.pos.y, r.pos.z,
        rxy * Math.cos(phi) * sp, cz * sp, rxy * Math.sin(phi) * sp,
        c, rand(4.5, 9.5), rand(1.3, 2.4)
      );
    }

    // 爆心闪光：几颗短命粒子把炸点提亮，尺寸压小避免 Bloom 糊成死白
    c.set(0xffeec6);
    for (let i = 0; i < 9; i++) {
      this._emit(
        r.pos.x, r.pos.y, r.pos.z,
        rand(-5, 5), rand(-5, 5), rand(-5, 5),
        c, rand(8, 14), rand(0.10, 0.20)
      );
    }
  }

  update(t, dt) {
    const cfg = this.cfg;
    const dragStep = Math.pow(cfg.drag, dt * 60); // 阻力按帧率无关的方式衰减

    // ---- 1. 发射节奏 ----
    this.timer -= dt;
    if (this.timer <= 0 && this.rockets.length < cfg.maxRockets) {
      this._launch();
      this.timer = rand(cfg.gap[0], cfg.gap[1]);
    }

    // ---- 2. 火箭上升 + 拖尾，到顶引爆 ----
    for (let i = this.rockets.length - 1; i >= 0; i--) {
      const r = this.rockets[i];
      r.pos.y += r.vy * dt;
      r.vy -= cfg.gravity * 0.12 * dt; // 上升段只受很弱的减速，接近匀速冲顶
      r.trail += dt;
      if (r.trail > 0.018) {
        r.trail = 0;
        this._emit(
          r.pos.x, r.pos.y, r.pos.z,
          rand(-1.6, 1.6), rand(-6, -2), rand(-1.6, 1.6),
          this._trailColor, rand(1.6, 3.0), rand(0.35, 0.8)
        );
      }
      if (r.pos.y >= r.targetY || r.vy <= 4) {
        this._burst(r);
        this.rockets.splice(i, 1);
      }
    }

    // ---- 3. 粒子积分（重力 + 阻力 + 衰减） ----
    for (let i = 0; i < this.cap; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        this.alpha[i] = 0;
        this.size[i] = 0;
        continue;
      }
      const p = i * 3;
      this.vel[p + 1] -= cfg.gravity * dt;
      this.vel[p] *= dragStep;
      this.vel[p + 1] *= dragStep;
      this.vel[p + 2] *= dragStep;
      this.pos[p] += this.vel[p] * dt;
      this.pos[p + 1] += this.vel[p + 1] * dt;
      this.pos[p + 2] += this.vel[p + 2] * dt;

      const k = this.life[i] / this.maxLife[i];
      // 前段保持全亮（炸开的一瞬），后段快速衰减，尾迹自然收尾
      this.alpha[i] = k > 0.82 ? 1 : Math.pow(k / 0.82, 1.25);
      this.size[i] = this.baseSize[i] * (0.4 + 0.6 * k);
    }

    // ---- 4. 数据上传 GPU ----
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aColor.needsUpdate = true;
    this.geo.attributes.aSize.needsUpdate = true;
    this.geo.attributes.aAlpha.needsUpdate = true;
  }
}

/* =========================================================================
 * 9. 光照 —— 夜景氛围的核心之一
 *  原则：光源数量尽量少（1 平行光 + 1 环境 + 1 半球 + 3 点光），不开阴影
 * ========================================================================= */
function initLights() {
  // 环境光：给暗部一点冷色底
  scene.add(new THREE.AmbientLight(0x2a3550, 0.75));

  // 半球光：天空冷 / 地面暖
  scene.add(new THREE.HemisphereLight(0x2b3e57, 0x161010, 1.0));

  // 月光（唯一的方向光，不投阴影以省性能）
  const moon = new THREE.DirectionalLight(0x9dbaff, 0.55);
  moon.position.set(-160, 180, 100);
  scene.add(moon);

  // 洪崖洞的暖色灯群（3 盏，照亮台地、屋顶和近处水面）
  const warmPositions = [
    [-30, 12, -60],
    [26, 26, -68],
    [0, 40, -86],
  ];
  warmPositions.forEach((p, i) => {
    const light = new THREE.PointLight(0xffa257, 2600 - i * 350, 300, 2);
    light.position.set(p[0], p[1], p[2]);
    scene.add(light);
  });

  // 桥上的一点点冷白光，拉开层次
  const bridgeLight = new THREE.PointLight(0xbfd4ff, 1400, 260, 2);
  bridgeLight.position.set(98, 34, -40);
  scene.add(bridgeLight);
}

/* =========================================================================
 * 10. 主程序：渲染器 / 场景 / 相机 / 控制器 / 后期
 * ========================================================================= */
let renderer;
let scene;
let camera;
let controls;
let composer;
let bloomPass;
let fxaaPass;
let clock;

let env;
let river;
let houses;
let bridge;
let city;
const boats = [];

// 夜空装饰与烟花
let moon;
let meteors;
let clouds;
let fireworks;

const container = document.getElementById('app');

function initRenderer() {
  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    stencil: false,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.28;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(CFG.fog.color);
  scene.fog = new THREE.FogExp2(CFG.fog.color, CFG.fog.density);

  camera = new THREE.PerspectiveCamera(
    CFG.camera.fov,
    window.innerWidth / window.innerHeight,
    CFG.camera.near,
    CFG.camera.far
  );
  camera.position.set(CFG.camera.pos[0], CFG.camera.pos[1], CFG.camera.pos[2]);

  clock = new THREE.Clock();

  setupControls();
  window.addEventListener('resize', onResize);
}

function setupControls() {
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(CFG.camera.target[0], CFG.camera.target[1], CFG.camera.target[2]);
  controls.enableDamping = true;      // 惯性阻尼，拖动更顺滑
  controls.dampingFactor = 0.055;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.85;
  controls.panSpeed = 0.6;
  controls.minDistance = 40;          // 不要穿进建筑里
  controls.maxDistance = 420;
  controls.maxPolarAngle = Math.PI * 0.55; // 限制俯仰，避免镜头钻到水面以下
  controls.update();
}

function initPost() {
  const pr = renderer.getPixelRatio();
  // 注意：一旦走 EffectComposer，WebGLRenderer 的 antialias 就失效了（渲染进了离屏 target）。
  // 必须给 RenderTarget 显式开 MSAA，否则灯光边缘、桥索、栏杆会有明显锯齿。
  const rt = new THREE.WebGLRenderTarget(
    Math.floor(window.innerWidth * pr),
    Math.floor(window.innerHeight * pr),
    { type: THREE.HalfFloatType, samples: CFG.msaaSamples }
  );
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(pr);
  composer.setSize(window.innerWidth, window.innerHeight);

  composer.addPass(new RenderPass(scene, camera));

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    CFG.bloom.strength,
    CFG.bloom.radius,
    CFG.bloom.threshold
  );
  composer.addPass(bloomPass);
  syncBloomSize();

  // OutputPass 负责 ACES 色调映射 + sRGB 输出
  composer.addPass(new OutputPass());

  // FXAA 放在最后一道：MSAA 只处理几何边缘，细桥索、远景楼群的像素级锯齿靠它收尾
  if (CFG.fxaa) {
    fxaaPass = new ShaderPass(FXAAShader);
    updateFxaaResolution();
    composer.addPass(fxaaPass);
  }
}

/** FXAA 需要知道「一个像素」在纹理坐标里的尺寸，窗口变化时必须同步 */
function updateFxaaResolution() {
  if (!fxaaPass) return;
  const pr = renderer.getPixelRatio();
  const u = fxaaPass.material.uniforms['resolution'].value;
  u.set(1 / (window.innerWidth * pr), 1 / (window.innerHeight * pr));
}

/** 泛光按 CFG.bloomScale 缩放分辨率（默认 1/2），这是整条链路里最贵的一步 */
function syncBloomSize() {
  if (!bloomPass) return;
  const s = CFG.bloomScale;
  bloomPass.setSize(
    Math.max(2, Math.floor((window.innerWidth * s))),
    Math.max(2, Math.floor((window.innerHeight * s)))
  );
}

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  syncBloomSize();   // composer.setSize 会把泛光重置成全分辨率，这里再压回去
  updateFxaaResolution();
}

/* ---------- 帧循环 ---------- */
let perfFrames = 0;
let perfTime = 0;
let perfChecked = false;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  controls.update();
  river.update(t);
  bridge.update(t);
  boats.forEach((b) => b.update(t));
  env.update(t);

  // 夜空装饰与烟花（构建失败时对象为 undefined，逐个判空避免整帧崩掉）
  if (moon) moon.update(t);
  if (clouds) clouds.update(t, dt);
  if (meteors) meteors.update(t, dt);
  if (fireworks) fireworks.update(t, dt);

  composer.render();

  // ---- 简易性能看门狗：跑 4 秒后若明显掉帧就降像素比 ----
  perfFrames++;
  perfTime += dt;
  if (!perfChecked && perfTime > 4) {
    perfChecked = true;
    const fps = perfFrames / perfTime;
    if (fps < 32) {
      renderer.setPixelRatio(1);
      composer.setPixelRatio(1);
      composer.setSize(window.innerWidth, window.innerHeight);
      syncBloomSize();
    }
  }
}

/* =========================================================================
 * 11. 加载进度 UI 与构建流程
 *  所有几何/贴图都是即时生成，这里把构建拆成若干步，
 *  让进度条能真实反映每一步的完成情况。
 * ========================================================================= */
const barFill = document.getElementById('barFill');
const pctEl = document.getElementById('pct');
const subEl = document.getElementById('sub');

function setProgress(p, label) {
  const v = Math.max(0, Math.min(1, p));
  barFill.style.width = (v * 100).toFixed(1) + '%';
  pctEl.textContent = Math.round(v * 100) + '%';
  if (label) subEl.textContent = label;
}

function hideLoading() {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => { el.style.display = 'none'; }, 950);
  document.getElementById('hud').classList.add('show');
}

const STEPS = [
  { label: '初始化渲染管线', fn: () => initRenderer() },
  { label: '生成夜空与雾气', fn: () => { env = new NightEnvironment(); scene.add(env.group); } },
  { label: '铺设嘉陵江水面', fn: () => { river = new JialingRiver(); scene.add(river.mesh); } },
  { label: '搭建洪崖洞吊脚楼群', fn: () => { houses = new StiltHouseComplex(); scene.add(houses.group); } },
  { label: '架设千厮门大桥', fn: () => { bridge = new QiansimenBridge(); scene.add(bridge.group); } },
  { label: '点亮远处城市楼群', fn: () => { city = new CitySkyline(); scene.add(city.group); } },
  { label: '安排江上游船', fn: () => {
      boats.push(new CruiseBoat({ range: 76, speed: 5.0, phase: 0.00, z: -32, scale: 1.15 }));
      boats.push(new CruiseBoat({ range: 104, speed: 3.2, phase: 0.62, z: 6, scale: 1.35 }));
      boats.push(new CruiseBoat({ range: 60, speed: 6.2, phase: 0.85, z: -54, scale: 0.9 }));
      boats.push(new CruiseBoat({ range: 96, speed: 2.6, phase: 0.31, z: 38, scale: 1.25 }));
      boats.forEach((b) => scene.add(b.group));
    } },
  { label: '布置光照与氛围', fn: () => initLights() },
  { label: '挂上大圆月与浮云', fn: () => {
      moon = new BigMoon();
      scene.add(moon.group);
      clouds = new CloudLayer();
      scene.add(clouds.group);
    } },
  { label: '等待流星划过夜空', fn: () => { meteors = new MeteorShower(); scene.add(meteors.group); } },
  { label: '点燃江畔烟花', fn: () => { fireworks = new Fireworks(); scene.add(fireworks.group); } },
  { label: '编译着色器', fn: () => { renderer.compile(scene, camera); } },
];

/** 环境兜底：WebGL 是否可用（浏览器禁用硬件加速 / 版本过旧时给出人话提示，而不是白屏） */
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'));
  } catch (e) {
    return false;
  }
}

async function boot() {
  if (!hasWebGL()) {
    const sub = document.getElementById('sub');
    const bar = document.getElementById('barFill');
    if (bar) bar.style.width = '100%';
    if (sub) {
      sub.style.color = '#c96b5a';
      sub.style.height = 'auto';
      sub.style.textAlign = 'center';
      sub.style.lineHeight = '1.9';
      sub.textContent = '当前浏览器不支持或已禁用 WebGL。请用 Chrome / Edge 打开，并在设置中开启「使用图形加速」。';
    }
    return;
  }

  const failed = [];
  for (let i = 0; i < STEPS.length; i++) {
    setProgress(i / STEPS.length, STEPS[i].label);
    await sleep(80);
    try {
      STEPS[i].fn();
    } catch (err) {
      failed.push(STEPS[i].label);
      console.error('[构建失败] ' + STEPS[i].label, err);
    }
  }

  setProgress(0.97, '准备后期处理');
  await sleep(120);
  initPost();

  // 先渲染一帧，避免遮罩淡出后出现黑屏
  try {
    composer.render();
  } catch (e) {
    renderer.render(scene, camera);
  }

  setProgress(1, '欢迎来到洪崖洞');
  if (failed.length) {
    // 有组件没建起来时，别假装成功：把失败项直接显示出来
    subEl.style.color = '#c96b5a';
    subEl.style.height = 'auto';
    subEl.textContent = '部分组件构建失败：' + failed.join('、') + '（按 F12 查看控制台）';
    await sleep(2200);
  }
  await sleep(480);
  hideLoading();
  animate();

  // 调试句柄：控制台里可直接改参数，例如 __DBG.CFG.bloom.strength = 0.8
  window.__DBG = {
    CFG, scene, camera, renderer, composer, bloomPass, fxaaPass, controls,
    river, bridge, boats, env, houses, city,
    moon, meteors, clouds, fireworks,
    stats: () => ({
      drawCalls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      textures: renderer.info.memory.textures,
      geometries: renderer.info.memory.geometries,
      pixelRatio: renderer.getPixelRatio(),
    }),
  };
}

boot();
</script>
